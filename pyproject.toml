[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "winfo-cli"
version = "0.1.0"
description = "A fast, polished Windows system information shell."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "winfo contributors" }]
dependencies = [
  "rich>=13.7",
  "psutil>=6.0",
  "WMI>=1.5.1; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.scripts]
winfo = "winfo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["winfo"]
